[project]
name = "linux-hwinfo64"
version = "0.1.4"
description = "A lightweight, terminal-based system monitoring tool for Linux that provides real-time hardware metrics (CPU and GPU) in both text and graphical formats"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=7.0.0",
    "distro>=1.6.0",
]
classifiers = [
    "Environment :: Console :: Curses",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/MahmoudDolah/linux_hwinfo64"
Repository = "https://github.com/MahmoudDolah/linux_hwinfo64"
Issues = "https://github.com/MahmoudDolah/linux_hwinfo64/issues"

[project.scripts]
linux-hwinfo64 = "linux_hwinfo64.main:main"

[dependency-groups]
dev = [
    "ruff>=0.11.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "linux_hwinfo64",
    "main.py",
    "README.md",
    "LICENSE.txt",
]
